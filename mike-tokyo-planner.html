<!doctype html>
<title>Thailand & Bali 2026</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=Space+Mono:wght@400;700&display=swap">
<style>
/* ── tokens ── */
:root {
  --g:#F7F2EA; --s:#FFFFFF; --s2:#EDE8DF; --b:rgba(0,0,0,.09);
  --t:#1A1410; --t2:#5C5248; --t3:#9A9088;
  --phuket:#E8762A; --samui:#16B8B0; --bali:#5BAF50; --transit:#7B6EC4; --mel:#7A8FA0;
  --lk:#C89A00; --lk-bg:rgba(200,154,0,.1); --lk-br:rgba(200,154,0,.3);
  --pd:#2A9FD6; --pd-bg:rgba(42,159,214,.1); --pd-br:rgba(42,159,214,.25);
  --id:#68A460; --id-bg:rgba(104,164,96,.1); --id-br:rgba(104,164,96,.25);
  --dn:#C83030; --dn-bg:rgba(200,48,48,.08); --dn-br:rgba(200,48,48,.22);
  --wn:#C87030; --wn-bg:rgba(200,112,48,.1); --wn-br:rgba(200,112,48,.25);
  --ok:#3DAA78;
  --ff:'DM Sans',system-ui,sans-serif;
  --ffd:'Syne',system-ui,sans-serif;
  --ffm:'Space Mono','Courier New',monospace;
  --nh:62px; --sb:env(safe-area-inset-bottom,0px);
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  --g:#0C0907;--s:#191410;--s2:#231D16;--b:rgba(255,255,255,.08);
  --t:#EDE7DC;--t2:#AFA89E;--t3:#6A6058;
}}
:root[data-theme=dark]{--g:#0C0907;--s:#191410;--s2:#231D16;--b:rgba(255,255,255,.08);--t:#EDE7DC;--t2:#AFA89E;--t3:#6A6058;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--g);color:var(--t);font-family:var(--ff);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}

/* ── layout ── */
#app{display:flex;flex-direction:column;height:100%;overflow:hidden;position:relative}
#vc{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column}
#nav{flex-shrink:0;height:calc(var(--nh)+var(--sb));padding-bottom:var(--sb);background:var(--s);border-top:1px solid var(--b);display:flex;align-items:center;z-index:50}
.nt{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;background:none;border:none;cursor:pointer;color:var(--t3);font-family:var(--ff);font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.nt.on{color:var(--phuket)}.nt .ni{font-size:22px;line-height:1.1}

/* ── day strip ── */
.dstrip{display:flex;gap:7px;overflow-x:auto;padding:10px 16px;scrollbar-width:none;background:var(--g);border-bottom:1px solid var(--b);flex-shrink:0}
.dstrip::-webkit-scrollbar{display:none}
.dp{display:flex;flex-direction:column;align-items:center;padding:7px 9px 5px;border-radius:10px;cursor:pointer;border:1.5px solid var(--b);background:var(--s);flex-shrink:0;min-width:42px;transition:all .15s;font-family:var(--ff)}
.dp-day{font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--t3);margin-bottom:1px}
.dp-num{font-family:var(--ffd);font-size:19px;font-weight:800;line-height:1;color:var(--t)}
.dp-dot{width:5px;height:5px;border-radius:50%;margin-top:4px}
.dp-w{font-size:9px;color:var(--dn);margin-top:1px}
.dp.act{border-width:2px}
.dp.act.phuket{border-color:var(--phuket);background:rgba(232,118,42,.08)}.dp.act.phuket .dp-num,.dp.act.phuket .dp-day{color:var(--phuket)}
.dp.act.samui{border-color:var(--samui);background:rgba(22,184,176,.08)}.dp.act.samui .dp-num,.dp.act.samui .dp-day{color:var(--samui)}
.dp.act.bali{border-color:var(--bali);background:rgba(91,175,80,.08)}.dp.act.bali .dp-num,.dp.act.bali .dp-day{color:var(--bali)}
.dp.act.transit{border-color:var(--transit);background:rgba(123,110,196,.08)}.dp.act.transit .dp-num,.dp.act.transit .dp-day{color:var(--transit)}
.dp.act.mel{border-color:var(--mel);background:rgba(122,143,160,.08)}.dp.act.mel .dp-num,.dp.act.mel .dp-day{color:var(--mel)}

/* ── day content ── */
.dcont{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px calc(20px);touch-action:pan-y}
.dloc{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;color:#fff;margin-bottom:14px}
.dloc.phuket{background:var(--phuket)}.dloc.samui{background:var(--samui)}.dloc.bali{background:var(--bali)}.dloc.transit{background:var(--transit)}.dloc.mel{background:var(--mel)}
.dhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.dhead-date{font-family:var(--ffd);font-size:22px;font-weight:800;color:var(--t)}
.today-pip{background:var(--phuket);color:#fff;font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:20px}
.stack{display:flex;flex-direction:column;gap:9px}

/* ── cards ── */
.card{background:var(--s);border-radius:13px;overflow:hidden;border:1px solid var(--b)}
.card-row{display:flex}
.stripe{width:5px;flex-shrink:0}
.stripe.phuket{background:var(--phuket)}.stripe.samui{background:var(--samui)}.stripe.bali{background:var(--bali)}.stripe.transit{background:var(--transit)}.stripe.mel{background:var(--mel)}
.card-body{flex:1;padding:12px 14px;min-width:0}
.c-top{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px}
.c-main{flex:1;min-width:0}
.c-time{font-family:var(--ffm);font-size:13px;font-weight:700;color:var(--t);margin-bottom:2px}
.c-title{font-size:15px;font-weight:600;color:var(--t);line-height:1.3}
.c-sub{font-size:12px;color:var(--t2);margin-top:1px;line-height:1.4}
.badge{display:inline-flex;align-items:center;gap:3px;font-size:9px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;padding:2px 6px;border-radius:20px;white-space:nowrap;flex-shrink:0;margin-top:1px}
.b-lk{color:var(--lk);background:var(--lk-bg);border:1px solid var(--lk-br)}
.b-pd{color:var(--pd);background:var(--pd-bg);border:1px solid var(--pd-br)}
.b-id{color:var(--id);background:var(--id-bg);border:1px solid var(--id-br)}
.c-details{display:flex;flex-direction:column;gap:3px;margin-top:7px}
.c-row{display:flex;align-items:baseline;gap:7px;font-size:12px;color:var(--t2);line-height:1.4}
.c-row .ci{width:14px;text-align:center;flex-shrink:0;font-size:11px}
.c-row a{text-decoration:underline;text-underline-offset:2px;color:inherit}
.ref{font-family:var(--ffm);font-size:11px;font-weight:700;color:var(--t);background:var(--s2);padding:1px 5px;border-radius:4px}
.c-links{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.lchip{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:20px;font-size:11px;font-weight:600;color:var(--pd);background:var(--pd-bg);border:1px solid var(--pd-br);cursor:pointer;transition:opacity .15s;font-family:var(--ff);-webkit-appearance:none}
.lchip:hover{opacity:.75}
.c-actions{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:4px;padding:6px 11px;border-radius:8px;font-size:12px;font-weight:600;border:none;cursor:pointer;font-family:var(--ff);transition:opacity .15s;background:var(--s2);color:var(--t2)}
.btn:hover{opacity:.75}
.btn-wn{background:var(--wn-bg);color:var(--wn);border:1px solid var(--wn-br)}
.btn-ok{background:rgba(61,170,120,.12);color:var(--ok);border:1px solid rgba(61,170,120,.25)}
.note-box{background:var(--s2);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--t2);line-height:1.5;margin-top:8px}

/* deadlines within card */
.cd-tag{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:20px;font-size:11px;font-weight:700;margin-top:6px}
.cd-hot{background:var(--dn-bg);color:var(--dn)}
.cd-warn{background:var(--wn-bg);color:var(--wn)}
.cd-ok{background:rgba(61,170,120,.1);color:var(--ok)}

/* ── banners ── */
.banner{border-radius:10px;padding:10px 13px;display:flex;gap:9px;align-items:flex-start;font-size:13px;line-height:1.4}
.bn-dn{background:var(--dn-bg);border:1px solid var(--dn-br);color:var(--t2)}
.bn-dn strong,.bn-dn .bi{color:var(--dn)}
.bn-wn{background:var(--wn-bg);border:1px solid var(--wn-br);color:var(--t2)}
.bn-wn strong,.bn-wn .bi{color:var(--wn)}
.bi{flex-shrink:0;font-size:14px;margin-top:1px}

/* ── free time ── */
.free-card{background:var(--s2);border:1.5px dashed var(--b);border-radius:10px;padding:11px 14px;display:flex;align-items:center;gap:10px}
.free-card .fi{font-size:18px;flex-shrink:0}
.free-card .ft{font-size:13px;color:var(--t2)}.free-card .ft strong{color:var(--t);font-weight:600}

/* ── TODAY view ── */
#v-today{display:flex;flex-direction:column;height:100%;overflow-y:auto;padding:0 0 16px}
.td-pad{padding:0 16px}
.today-loc{display:flex;align-items:center;gap:8px;padding:14px 16px 0}
.today-loc .tl-dot{width:10px;height:10px;border-radius:50%}
.tl-dot.phuket{background:var(--phuket)}.tl-dot.samui{background:var(--samui)}.tl-dot.bali{background:var(--bali)}.tl-dot.transit{background:var(--transit)}.tl-dot.mel{background:var(--mel)}
.today-loc .tl-label{font-size:12px;font-weight:700;color:var(--t2)}
.td-date{font-family:var(--ffd);font-size:24px;font-weight:800;color:var(--t);padding:4px 16px 12px;line-height:1.15}

/* Ready-by hero */
.rby{border-radius:16px;margin:0 16px 16px;padding:18px 20px;color:#fff;flex-shrink:0}
.rby.phuket{background:var(--phuket)}.rby.samui{background:var(--samui)}.rby.bali{background:var(--bali)}.rby.transit{background:var(--transit)}
.rby-label{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.8;margin-bottom:3px}
.rby-time{font-family:var(--ffd);font-size:56px;font-weight:800;line-height:1;margin-bottom:3px}
.rby-for{font-size:14px;opacity:.9}

/* Countdown hero (pre-trip) */
.pre-hero{text-align:center;padding:52px 16px 28px}
.pre-num{font-family:var(--ffd);font-size:96px;font-weight:800;line-height:1;color:var(--phuket)}
.pre-unit{font-size:20px;font-weight:600;color:var(--t2);margin-bottom:28px}
.pre-list{background:var(--s);border-radius:13px;border:1px solid var(--b);overflow:hidden;text-align:left}
.pre-row{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-bottom:1px solid var(--b)}
.pre-row:last-child{border:none}
.pre-icon{font-size:16px;flex-shrink:0;margin-top:1px}
.pre-body{flex:1}
.pre-title{font-size:14px;font-weight:600;color:var(--t);margin-bottom:1px}
.pre-sub{font-size:12px;color:var(--t2)}

/* Section headers */
.sh{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);padding:14px 16px 7px}
.sh:first-child{padding-top:0}

/* Now/next pill */
.now-pill{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ok);background:rgba(61,170,120,.1);border:1px solid rgba(61,170,120,.25);padding:2px 8px;border-radius:20px;margin-bottom:6px}
.next-pill{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);background:var(--s2);padding:2px 8px;border-radius:20px;margin-bottom:6px}

/* Post-trip */
.post{text-align:center;padding:72px 16px;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.post-em{font-size:64px;margin-bottom:12px}
.post-h{font-family:var(--ffd);font-size:28px;font-weight:800;color:var(--t);margin-bottom:8px}
.post-sub{font-size:15px;color:var(--t2)}

/* ── BOOKINGS view ── */
#v-bookings{overflow-y:auto;padding-bottom:16px}
.bk-tabs{display:flex;border-bottom:1px solid var(--b);background:var(--s);flex-shrink:0;overflow-x:auto;scrollbar-width:none}
.bk-tabs::-webkit-scrollbar{display:none}
.bk-tab{flex:1;min-width:80px;padding:11px 4px 10px;font-size:12px;font-weight:600;font-family:var(--ff);color:var(--t3);background:none;border:none;border-bottom:2.5px solid transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;transition:color .15s,border-color .15s;white-space:nowrap}
.bk-tab-on{color:var(--phuket);border-bottom-color:var(--phuket)}
.bk-tab-n{font-size:10px;font-weight:700;background:var(--s2);color:var(--t3);border-radius:10px;padding:1px 6px;font-family:var(--ffm)}
.bk-tab-on .bk-tab-n{background:rgba(232,118,42,.12);color:var(--phuket)}
.bk-sec{padding:0 16px}
.bk-sec-h{font-family:var(--ffd);font-size:13px;font-weight:700;color:var(--t3);letter-spacing:.04em;padding:14px 0 8px;border-bottom:1px solid var(--b);margin-bottom:10px}
.bk-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;padding-bottom:10px;border-bottom:1px solid var(--b)}

/* ── OPTIONS view ── */
#v-options{overflow-y:auto;padding:0 0 16px}
.opt-filter{display:flex;gap:7px;overflow-x:auto;padding:12px 16px 10px;scrollbar-width:none;border-bottom:1px solid var(--b);flex-shrink:0}
.opt-filter::-webkit-scrollbar{display:none}
.fbt{padding:5px 13px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--b);background:var(--s);color:var(--t2);font-family:var(--ff);white-space:nowrap;transition:all .15s;flex-shrink:0}
.fbt.on{border-color:currentColor}
.fbt.on.all{color:var(--t);border-color:var(--t2)}
.fbt.on.phuket{color:var(--phuket);background:rgba(232,118,42,.08)}
.fbt.on.samui{color:var(--samui);background:rgba(22,184,176,.08)}
.fbt.on.bali{color:var(--bali);background:rgba(91,175,80,.08)}
.fbt.on.food{color:var(--lk);background:var(--lk-bg)}

/* ── MODAL ── */
#modal{position:fixed;inset:0;z-index:200;pointer-events:none}
#modal.open{pointer-events:all}
.mo{position:absolute;inset:0;background:rgba(0,0,0,0);transition:background .22s;display:flex;align-items:flex-end;justify-content:center}
.mo.vis{background:rgba(0,0,0,.58);backdrop-filter:blur(3px)}
.ms{background:var(--s);border-radius:20px 20px 0 0;padding:20px 20px calc(20px + var(--sb));width:100%;max-width:600px;max-height:84vh;overflow-y:auto;transform:translateY(100%);transition:transform .24s cubic-bezier(.32,1,.18,1)}
.ms.vis{transform:translateY(0)}
.mh{width:36px;height:4px;background:var(--b);border-radius:2px;margin:0 auto 18px}
.mt{font-family:var(--ffd);font-size:20px;font-weight:800;color:var(--t);margin-bottom:8px;text-wrap:balance;line-height:1.2}
.mb{font-size:14px;color:var(--t2);line-height:1.55;margin-bottom:14px}
.mw{background:var(--dn-bg);border:1px solid var(--dn-br);border-radius:8px;padding:10px 13px;font-size:13px;color:var(--dn);margin-bottom:14px;line-height:1.4}
.mok{background:rgba(61,170,120,.1);border:1px solid rgba(61,170,120,.25);border-radius:8px;padding:10px 13px;font-size:13px;color:var(--ok);margin-bottom:14px;line-height:1.4}
.macts{display:flex;flex-direction:column;gap:8px}
.mbtn{width:100%;justify-content:center;padding:14px;border-radius:12px;font-size:15px;font-weight:600;border:none;cursor:pointer;font-family:var(--ff);display:flex;align-items:center;gap:6px}
.mbtn-ok{background:var(--ok);color:#fff}
.mbtn-dn{background:var(--dn);color:#fff}
.mbtn-cc{background:var(--s2);color:var(--t2)}
.mi{width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid var(--b);background:var(--s2);color:var(--t);font-family:var(--ff);font-size:15px;margin-bottom:10px;outline:none}
.mi:focus{border-color:var(--pd)}
.ml{font-size:12px;font-weight:600;color:var(--t2);margin-bottom:5px;display:block}

/* ── HEADER ── */
#hdr{flex-shrink:0;background:var(--s);border-bottom:1px solid var(--b);padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:48px;z-index:20}
.hdr-title{font-family:var(--ffd);font-size:17px;font-weight:800;color:var(--t);letter-spacing:-.01em}
.hdr-acts{display:flex;gap:2px}
.hdr-btn{width:38px;height:38px;border-radius:10px;border:none;background:none;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--t2);transition:background .12s}
.hdr-btn:active{background:var(--s2)}

/* ── SEARCH OVERLAY ── */
#so{position:absolute;inset:0;z-index:80;background:var(--g);display:none;flex-direction:column}
#so.open{display:flex}
#so-hdr{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--b);background:var(--s);flex-shrink:0}
#so-input{flex:1;padding:9px 13px;border-radius:10px;border:1.5px solid var(--b);background:var(--s2);color:var(--t);font-family:var(--ff);font-size:15px;outline:none;-webkit-appearance:none}
#so-input:focus{border-color:var(--pd)}
#so-cancel{background:none;border:none;color:var(--pd);font-family:var(--ff);font-size:14px;font-weight:600;cursor:pointer;padding:0 2px;white-space:nowrap;flex-shrink:0}
#so-results{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 16px 24px}
.sr-label{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);margin:12px 0 6px}
.sr-day{background:var(--s);border:1px solid var(--b);border-radius:12px;padding:11px 14px;margin-bottom:8px;cursor:pointer;active:opacity:.7}
.sr-food{background:var(--s);border:1px solid var(--b);border-radius:12px;padding:11px 14px;margin-bottom:8px}

@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ── MAPS view ── */
#v-maps{display:flex;flex-direction:column;height:100%;overflow:hidden}
#map-wrap{flex:1;min-height:0;position:relative;overflow:hidden}
#map-div{width:100%;height:100%}
.map-legend{padding:7px 14px;background:var(--s);border-top:1px solid var(--b);display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;flex-shrink:0;align-items:center}
.map-legend::-webkit-scrollbar{display:none}
.map-legend-item{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--t2);white-space:nowrap;flex-shrink:0}
.mk-popup .leaflet-popup-content-wrapper{border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.22);border:none;font-family:'DM Sans',sans-serif}
.mk-popup .leaflet-popup-content{margin:11px 15px;font-size:13px}
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;-webkit-tap-highlight-color:transparent;background:#d4e7f5;outline:0}
.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow{-webkit-user-select:none;-moz-user-select:none;user-select:none;-webkit-user-drag:none}
.leaflet-tile::selection,.leaflet-tile::-moz-selection{background:transparent}
.leaflet-container.leaflet-touch-zoom{touch-action:pan-x pan-y}
.leaflet-container.leaflet-touch-drag{touch-action:none;touch-action:pinch-zoom}
.leaflet-container.leaflet-touch-zoom.leaflet-touch-drag{touch-action:none}
.leaflet-zoom-animated{transform-origin:0 0}
.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform 0.25s cubic-bezier(0,0,0.25,1);will-change:transform}
.leaflet-zoom-anim .leaflet-tile,.leaflet-pan-anim .leaflet-tile{transition:none}
.leaflet-map-pane{z-index:400}.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}
.leaflet-shadow-pane{z-index:500}.leaflet-marker-pane{z-index:600}.leaflet-tooltip-pane{z-index:650}.leaflet-popup-pane{z-index:700}
.leaflet-map-pane canvas{z-index:100}.leaflet-map-pane svg{z-index:200}

let S={overrides:{},customItems:[],baliChecks:{}};
let CAP=null, READONLY=false;
let VIEW='today', SEL_DAY='', OPT_F='all', BK_TAB='flights', MAP_LOC='phuket';
let SWIPE_X=0, SEARCH_OPEN=false, SEARCH_Q='', PENDING_LINK='';

function initSelDay(){
  const t=todayStr();
  const d=DAYS.find(d=>d.d===t);
  SEL_DAY=d?t:TRIP_START;
}

function effectItem(id){
  const base=[...BASE_ITEMS,...FOOD_ITEMS,...(S.customItems||[])].find(i=>i.id===id);
  if(!base) return null;
  return {...base,...(S.overrides[id]||{})};
}
function allItems(){
  return [...BASE_ITEMS,...FOOD_ITEMS,...(S.customItems||[])].map(i=>effectItem(i.id)).filter(Boolean);
}
function itemsForDay(date){
  return allItems().filter(i=>{
    if(!i.date) return false;
    if(i.date===date) return true;
    return false;
  }).sort((a,b)=>(a.time||'zz').localeCompare(b.time||'zz'));
}

/* ══════════════════════════════════════
   PERSISTENCE
══════════════════════════════════════ */
async function loadState(){
  try{const r=await fetch('state.json?t='+Date.now());if(r.ok)S=await r.json();}catch{}
}
async function saveState(){
  if(!CAP||READONLY)return;
  try{await CAP.publish({'state.json':JSON.stringify(S)});}
  catch(e){if(e&&e.code==='not_writer')READONLY=true;}
}
function saveUI(){
  try{sessionStorage.setItem('tui2',JSON.stringify({v:VIEW,sd:SEL_DAY,of:OPT_F,bt:BK_TAB,ml:MAP_LOC}));}catch{}
}
function loadUI(){
  try{const u=JSON.parse(sessionStorage.getItem('tui2')||'{}');
    if(u.v)VIEW=u.v;if(u.sd)SEL_DAY=u.sd;if(u.of)OPT_F=u.of;if(u.bt)BK_TAB=u.bt;if(u.ml)MAP_LOC=u.ml;
  }catch{}
}

/* ══════════════════════════════════════
   HELPERS
══════════════════════════════════════ */
function todayStr(){return new Date().toISOString().split('T')[0];}
function daysUntil(d){const n=new Date(),t=new Date(d+'T12:00:00');n.setHours(0,0,0,0);t.setHours(0,0,0,0);return Math.round((t-n)/864e5);}
function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function locColor(loc){return{phuket:'var(--phuket)',samui:'var(--samui)',bali:'var(--bali)',transit:'var(--transit)',mel:'var(--mel)'}[loc]||'var(--t3)';}
function locLabel(loc){return{phuket:'Phuket',samui:'Koh Samui',bali:'Bali',transit:'In transit',mel:'Melbourne'}[loc]||loc;}

function cdTag(date,label,urgent){
  const d=daysUntil(date);
  if(d<0)return`<span class="cd-tag cd-ok">✓ ${esc(label)}</span>`;
  if(d===0)return`<span class="cd-tag cd-hot">🚨 ${esc(label)}: TODAY</span>`;
  if(urgent&&d<=5)return`<span class="cd-tag cd-hot">⚠️ ${esc(label)}: ${d}d</span>`;
  if(d<=14)return`<span class="cd-tag cd-warn">⏳ ${esc(label)}: ${d} days</span>`;
  return`<span class="cd-tag cd-ok">📅 ${esc(label)}: ${d} days</span>`;
}

function badge(status){
  if(status==='locked')return`<span class="badge b-lk">🔒 Locked</span>`;
  if(status==='pending')return`<span class="badge b-pd">⏳ Pending</span>`;
  return`<span class="badge b-id">💡 Idea</span>`;
}

function banners(conflicts){
  if(!conflicts||!conflicts.length)return'';
  return conflicts.map(id=>{
    const c=CONFLICT_DEFS[id];if(!c)return'';
    const cls=c.sev==='danger'?'bn-dn':'bn-wn',ic=c.sev==='danger'?'🚨':'⚠️';
    return`<div class="banner ${cls}"><span class="bi">${ic}</span><div><strong>${esc(c.title)}</strong><br>${esc(c.body)}</div></div>`;
  }).join('');
}

/* ══════════════════════════════════════
   CARD RENDERER
══════════════════════════════════════ */
function card(item,opts={}){
  if(!item)return'';
  const{compact=false,showDate=false}=opts;
  const icon={flight:'✈️',accom:'🏨',dental:'🦷',golf:'⛳',activity:'🎯',transport:'🚗',food:'🍽️'}[item.type]||'📍';
  let timeStr=item.time&&item.time!=='null'?item.time:'';
  if(item.endTime&&timeStr)timeStr+=` → ${item.endTime}`;
  else if(item.endTime)timeStr=item.endTime;

  const dlBadges=(item.deadlines||[]).map(dl=>cdTag(dl.date,dl.label,dl.urgent)).join(' ');
  const conflictHtml=banners(item.conflicts);
  const linkHtml=(item.links||[]).map(lk=>`<button type="button" class="lchip" data-url="${esc(lk.u)}" data-label="${esc(lk.l)}" onclick="openLink(this.dataset.label,this.dataset.url)">🔗 ${esc(lk.l)}</button>`).join('');

  let acts='';
  if(!compact){
    if(item.status==='locked')acts=`<div class="c-actions"><button class="btn btn-wn" onclick="doUnlock('${esc(item.id)}')" aria-label="Unlock to edit">🔓 Unlock to edit</button></div>`;
    else if(item.status==='pending')acts=`<div class="c-actions"><button class="btn btn-ok" onclick="doConfirm('${esc(item.id)}')" aria-label="Mark confirmed">✅ Mark as confirmed</button></div>`;
  }

  return`<div class="card" id="card-${esc(item.id)}">
    <div class="card-row">
      <div class="stripe ${esc(item.loc||'phuket')}"></div>
      <div class="card-body">
        <div class="c-top">
          <div class="c-main">
            ${showDate&&item.date?`<div style="font-size:10px;color:var(--t3);font-weight:700;margin-bottom:2px;letter-spacing:.04em;text-transform:uppercase">${item.date.slice(5).replace('-',' ')}</div>`:''}
            ${timeStr?`<div class="c-time">${esc(timeStr)}</div>`:''}
            <div class="c-title">${icon} ${esc(item.title)}</div>
            ${item.sub?`<div class="c-sub">${esc(item.sub)}</div>`:''}
          </div>
          ${badge(item.status)}
        </div>
        <div class="c-details">
          ${item.addr?`<div class="c-row"><span class="ci">📍</span><span>${esc(item.addr)}</span></div>`:''}
          ${item.phone?`<div class="c-row"><span class="ci">📞</span><a href="tel:${esc(item.phone)}">${esc(item.phone)}</a></div>`:''}
          ${item.ref?`<div class="c-row"><span class="ci">🎫</span><span class="ref">${esc(item.ref)}</span></div>`:''}
          ${item.cost?`<div class="c-row"><span class="ci">💰</span><span style="font-family:var(--ffm);font-size:11px">${esc(item.cost)}</span></div>`:''}
          ${!compact&&item.note?`<div class="c-row"><span class="ci">ℹ️</span><span style="font-size:12px;line-height:1.5">${esc(item.note)}</span></div>`:''}
        </div>
        ${dlBadges?`<div style="margin-top:7px;display:flex;flex-wrap:wrap;gap:5px">${dlBadges}</div>`:''}
        ${conflictHtml?`<div style="margin-top:8px;display:flex;flex-direction:column;gap:6px">${conflictHtml}</div>`:''}
        ${linkHtml?`<div class="c-links">${linkHtml}</div>`:''}
        ${acts}
      </div>
    </div>
  </div>`;
}

function renderBaliChecklist(){
  const checks=S.baliChecks||{};
  const allDone=BALI_CHECKLIST.every(c=>checks[c.id]);

  return`<div style="margin:14px 16px 0">
    <div style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);margin-bottom:8px">🇮🇩 Bali entry requirements</div>
    <div style="display:flex;flex-direction:column;gap:7px">
      ${BALI_CHECKLIST.map(c=>{
        const done=!!checks[c.id];
        return`<div style="background:var(--s);border:1.5px solid ${done?'var(--ok)':'var(--b)'};border-radius:11px;padding:11px 13px;display:flex;gap:11px;align-items:flex-start">
          <button onclick="toggleBaliCheck('${c.id}')" style="flex-shrink:0;width:22px;height:22px;border-radius:6px;border:2px solid ${done?'var(--ok)':'var(--b)'};background:${done?'var(--ok)':'transparent'};cursor:pointer;display:flex;align-items:center;justify-content:center;margin-top:1px">
            ${done?`<span style="color:#fff;font-size:12px;font-weight:700">✓</span>`:''}
          </button>
          <div style="flex:1;min-width:0">
            <div style="font-size:14px;font-weight:600;color:${done?'var(--t3)':'var(--t)'};text-decoration:${done?'line-through':'none'}">${esc(c.label)}</div>
            <div style="font-size:12px;color:var(--t3);margin-top:2px">${esc(c.sub)}</div>
            ${!done?`<div style="font-size:11px;color:var(--t2);margin-top:5px;line-height:1.4">${esc(c.tip)}</div>`:''}
            ${!done&&c.link?`<button type="button" data-url="${esc(c.link.u)}" data-label="${esc(c.link.l)}" onclick="openLink(this.dataset.label,this.dataset.url)" style="display:inline-block;margin-top:6px;font-size:12px;font-weight:600;color:var(--pd);background:none;border:none;cursor:pointer;padding:0;font-family:var(--ff)">${esc(c.link.l)} ↗</button>`:''}
          </div>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}
function toggleBaliCheck(id){
  if(!S.baliChecks)S.baliChecks={};
  S.baliChecks[id]=!S.baliChecks[id];
  render();saveState();
}

/* ══════════════════════════════════════
   VIEW: TODAY
══════════════════════════════════════ */
function renderToday(){
  const t=todayStr();
  const dStart=daysUntil(TRIP_START), dEnd=daysUntil(TRIP_END);

  // Pre-trip
  if(dStart>0){
    const allChecked=BALI_CHECKLIST.every(c=>(S.baliChecks||{})[c.id]);
    const actions=[
      {ic:'🏌️',title:'Golf reconfirm deadline: Wed 24 Sep',sub:cdTag('2026-09-24','Red Mountain Golf — RECONFIRM',true)},
      {ic:'🚗',title:'Confirm Bali Kenji total price',sub:'Include late-night DPS pickup surcharge + confirm driver name'},
      {ic:'📅',title:'Plan Saturday 19 Sep',sub:'Big Buddha + shopping pencilled but not locked — decide'},
      ...(allChecked?[]:[{ic:'🇮🇩',title:'Bali entry requirements',sub:`${BALI_CHECKLIST.filter(c=>!(S.baliChecks||{})[c.id]).length} of ${BALI_CHECKLIST.length} items incomplete — see checklist below`}]),
    ];
    return`<div id="v-today">
      <div class="pre-hero">
        <div class="pre-num">${dStart}</div>
        <div class="pre-unit">days until Thailand 🌏</div>
      </div>
      <div style="padding:0 16px">
        <div style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);margin-bottom:8px">Before you go</div>
        <div class="pre-list">
          ${actions.map(a=>`<div class="pre-row"><span class="pre-icon">${a.ic}</span><div class="pre-body"><div class="pre-title">${a.title}</div><div class="pre-sub">${a.sub}</div></div></div>`).join('')}
        </div>
      </div>
      ${renderBaliChecklist()}
    </div>`;
  }

  // Post-trip
  if(dEnd<0){
    return`<div id="v-today"><div class="post"><div class="post-em">🏡</div><div class="post-h">You're home!</div><div class="post-sub">Trip complete · Sep 17 – 30, 2026</div></div></div>`;
  }

  // In-trip
  const dayObj=DAYS.find(d=>d.d===t)||DAYS[DAYS.length-1];
  const items=itemsForDay(t);
  const flights=items.filter(i=>i.type==='flight');
  const accomIn=items.filter(i=>i.type==='accom'&&i.date===t);
  const activities=items.filter(i=>!['flight','accom'].includes(i.type));

  // Compute "be ready by"
  let rbyTime=null,rbyFor='',rbyLoc=dayObj.loc;
  const firstFlight=flights.filter(f=>f.time&&f.time.match(/^\d\d:\d\d$/)).sort((a,b)=>a.time.localeCompare(b.time))[0];
  if(firstFlight){
    const[h,m]=firstFlight.time.split(':').map(Number);
    const dep=h*60+m,rdy=dep-120;
    rbyTime=`${String(Math.floor(rdy/60)).padStart(2,'0')}:${String(rdy%60).padStart(2,'0')}`;
    rbyFor=`Airport check-in for ${firstFlight.title}`;
  } else if(t==='2026-09-27'){
    rbyTime='08:00';rbyFor='Golf pickup from Thavorn lobby';
  } else if(t==='2026-09-28'&&items.find(i=>i.id==='D02')){
    rbyTime='09:30';rbyFor='Cube Dental (crown fitting)';
  }

  // NOW / NEXT
  const now=new Date(),nowMins=now.getHours()*60+now.getMinutes();
  const timedItems=items.filter(i=>i.time&&i.time.match(/^\d\d:\d\d$/)).sort((a,b)=>a.time.localeCompare(b.time));
  let nowItem=null,nextItem=null;
  for(let i=0;i<timedItems.length;i++){
    const[h,m]=timedItems[i].time.split(':').map(Number);
    const mins=h*60+m;
    if(mins<=nowMins){nowItem=timedItems[i];}
    else if(!nextItem){nextItem=timedItems[i];}
  }

  const dayConf=(DAYS.find(d=>d.d===t)||{}).conflicts||[];

  return`<div id="v-today">
    <div class="today-loc">
      <span class="tl-dot ${dayObj.loc}"></span>
      <span class="tl-label">${locLabel(dayObj.loc)}</span>
    </div>
    <div class="td-date">${dayObj.lbl}</div>

    ${dayConf.length?`<div style="padding:0 16px;display:flex;flex-direction:column;gap:7px;margin-bottom:14px">${banners(dayConf)}</div>`:''}

    ${rbyTime?`<div class="rby ${rbyLoc}">
      <div class="rby-label">Be ready by</div>
      <div class="rby-time">${rbyTime}</div>
      <div class="rby-for">${esc(rbyFor)}</div>
    </div>`:''}

    ${nowItem||nextItem?`<div class="td-pad">
      ${nowItem?`<div style="margin-bottom:10px"><div class="now-pill">● Now</div>${card(nowItem,{compact:true})}</div>`:''}
      ${nextItem?`<div style="margin-bottom:10px"><div class="next-pill">▸ Next</div>${card(nextItem,{compact:true})}</div>`:''}
    </div>`:''}

  </div>`;
}

/* ══════════════════════════════════════
   VIEW: TRIP (day picker)
══════════════════════════════════════ */
function renderTrip(){
  const t=todayStr();
  const strip=DAYS.map(day=>{
    const hasConf=(day.conflicts||[]).length>0;
    const isToday=day.d===t;
    const isSel=day.d===SEL_DAY;
    const dotColor=`background:${locColor(day.loc)}`;
    return`<button class="dp${isSel?' act '+day.loc:''}" onclick="selDay('${day.d}')" aria-label="${esc(day.lbl)}" aria-pressed="${isSel}">
      <span class="dp-day">${esc(day.day)}</span>
      <span class="dp-num">${esc(day.num)}</span>
      <span class="dp-dot" style="${dotColor}"></span>
      ${hasConf?`<span class="dp-w">!</span>`:''}
      ${isToday&&!isSel?`<span style="font-size:8px;color:var(--phuket);font-weight:700;margin-top:1px">TODAY</span>`:''}
    </button>`;
  }).join('');

  const day=DAYS.find(d=>d.d===SEL_DAY)||DAYS[0];
  const isToday=day.d===t;
  const dayItems=itemsForDay(day.d);
  const dayConf=day.conflicts||[];

  // Staying-at check
  const stayingAt=allItems().find(i=>i.type==='accom'&&i.date&&i.endDate&&i.date<day.d&&i.endDate>=day.d);

  let content='';
  if(day.d===TRIP_END){
    content=`<div class="post" style="padding:40px 0"><div class="post-em">🏡</div><div class="post-h">Home!</div><div class="post-sub">Land Melbourne 06:15</div></div>`;
  } else {
    const itemsHtml=dayItems.length?dayItems.map(i=>card(i)).join(''):`<div class="free-card"><span class="fi">🌴</span><div class="ft"><strong>Free time</strong> — nothing locked in.</div></div>`;
    const stayHtml=stayingAt?`<div class="free-card" style="margin-top:9px"><span class="fi">🏨</span><div class="ft"><strong>Staying at:</strong> ${esc(stayingAt.title)}<br><span style="font-size:11px">${esc(stayingAt.addr||'')}</span></div></div>`:'';
    content=`
      ${dayConf.length?`<div style="display:flex;flex-direction:column;gap:7px;margin-bottom:12px">${banners(dayConf)}</div>`:''}
      <div style="margin-bottom:10px;font-size:13px;color:var(--t2);line-height:1.5">${esc(day.summ)}</div>
      <div class="stack">${itemsHtml}</div>
      ${stayHtml}
    `;
  }

  return`<div id="v-trip" style="display:flex;flex-direction:column;height:100%;overflow:hidden">
    <div class="dstrip" id="dstrip">${strip}</div>
    <div class="dcont" id="dcont"
         ontouchstart="SWIPE_X=event.changedTouches[0].screenX"
         ontouchend="handleSwipe(event)">
      <div class="dhead">
        <div class="dhead-date">${esc(day.lbl)}</div>
        <div style="display:flex;align-items:center;gap:7px">
          ${isToday?`<span class="today-pip">TODAY</span>`:''}
          <span class="dloc ${day.loc}">${locLabel(day.loc)}</span>
        </div>
      </div>
      ${content}
    </div>
  </div>`;
}

function handleSwipe(e){
  const dx=SWIPE_X-e.changedTouches[0].screenX;
  if(Math.abs(dx)<50)return;
  const idx=DAYS.findIndex(d=>d.d===SEL_DAY);
  if(dx>0&&idx<DAYS.length-1)selDay(DAYS[idx+1].d);
  else if(dx<0&&idx>0)selDay(DAYS[idx-1].d);
}

function selDay(date){
  SEL_DAY=date;
  if(VIEW!=='trip')sv('trip');
  else render();
}

function setBkTab(t){BK_TAB=t;saveUI();render();}

function renderBookings(){
  const items=allItems();
  const flights=items.filter(i=>i.type==='flight').sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const hotels=items.filter(i=>i.type==='accom').sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const activities=items.filter(i=>!['flight','accom'].includes(i.type)).sort((a,b)=>(a.date||'').localeCompare(b.date||''));

  // Golf deadline alert
  const gd=daysUntil('2026-09-24');
  const alert=gd>=0&&gd<=7?`<div class="banner bn-dn" style="margin:0 16px 14px"><span class="bi">🚨</span><div><strong>Reconfirm Red Mountain Golf</strong><br>${gd===0?'TODAY — do it now':gd+' day'+(gd===1?'':'s')+' left'}. Call phuketgolfleisure.com or booking is cancelled.</div></div>`:'';

  const tabs=[{k:'flights',l:'✈️ Flights',n:flights.length},{k:'hotels',l:'🏨 Hotels',n:hotels.length},{k:'activities',l:'🎯 Activities',n:activities.length}];
  const tabBar=`<div class="bk-tabs">${tabs.map(t=>`<button class="bk-tab${BK_TAB===t.k?' bk-tab-on':''}" onclick="setBkTab('${t.k}')">${t.l}<span class="bk-tab-n">${t.n}</span></button>`).join('')}</div>`;

  const pending=BK_TAB==='flights'?flights.filter(i=>i.status==='pending'):BK_TAB==='hotels'?hotels.filter(i=>i.status==='pending'):activities.filter(i=>i.status==='pending');
  const locked=BK_TAB==='flights'?flights.filter(i=>i.status==='locked'):BK_TAB==='hotels'?hotels.filter(i=>i.status==='locked'):activities.filter(i=>i.status==='locked');
  const ideas=BK_TAB==='activities'?activities.filter(i=>i.status==='idea'):[];

  const sec=(title,arr,opts)=>arr.length?`<div class="bk-sec"><div class="bk-sec-h">${title}</div><div class="stack">${arr.map(i=>card(i,opts||{})).join('')}</div></div>`:'';

  return`<div id="v-bookings">
    ${tabBar}
    <div style="padding:14px 16px 0;display:flex;flex-direction:column;gap:0">
      ${alert}
      ${sec('⏳ Pending',pending,{showDate:true})}
      ${sec('🔒 Confirmed',locked,{showDate:true})}
      ${sec('💡 Ideas',ideas,{showDate:true})}
      ${!pending.length&&!locked.length&&!ideas.length?`<div style="text-align:center;padding:40px 0;color:var(--t3)">Nothing here.</div>`:''}
    </div>
  </div>`;
}

/* Mercator projection — maps lat/lng to SVG x/y */
function mkProject(cfg){
  const {bbox,vw,vh}=cfg;
  const toRad=d=>d*Math.PI/180;
  const merc=lat=>Math.log(Math.tan(Math.PI/4+toRad(lat)/2));
  const minM=merc(bbox.minLat),maxM=merc(bbox.maxLat);
  return function(lat,lng){
    const x=(lng-bbox.minLng)/(bbox.maxLng-bbox.minLng)*vw;
    const y=(maxM-merc(lat))/(maxM-minM)*vh;
    return [x,y];
  };
}

let svgPz={s:1,tx:0,ty:0};

function applyPz(g,vw,vh){
  const minS=0.7,maxS=8;
  svgPz.s=Math.max(minS,Math.min(maxS,svgPz.s));
  const pad=40;
  svgPz.tx=Math.max(-vw*svgPz.s+pad,Math.min(vw-pad,svgPz.tx));
  svgPz.ty=Math.max(-vh*svgPz.s+pad,Math.min(vh-pad,svgPz.ty));
  g.setAttribute('transform',`translate(${svgPz.tx} ${svgPz.ty}) scale(${svgPz.s})`);
}

function initMap(){

    div.style.cssText='display:flex;align-items:center;justify-content:center;height:100%;background:#d4e7f5;flex-direction:column;gap:8px;padding:24px;text-align:center';
    div.innerHTML='<div style="font-size:32px">🗺️</div><div style="font-size:14px;color:#444;font-family:DM Sans,sans-serif">Map requires internet connection.<br>Open the HTML file in your browser to see the full map.</div>';
    return;
  }

  const centers={
    phuket:{lat:7.93,lng:98.34,zoom:11},
    samui:{lat:9.50,lng:99.99,zoom:12},
    bali:{lat:-8.81,lng:115.17,zoom:12}
  };
  const c=centers[MAP_LOC];

  const map=L.map('map-div',{zoomControl:true,attributionControl:true}).setView([c.lat,c.lng],c.zoom);

  // OpenStreetMap tiles — works perfectly when file is opened locally
  const tileLayer=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
    attribution:'© <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors',
    maxZoom:19
  }).addTo(map);

  // If tiles fail (e.g. CSP in artifact), show a notice overlay
  let tileErrorCount=0;
  tileLayer.on('tileerror',()=>{
    tileErrorCount++;
    if(tileErrorCount===3){
      const notice=document.createElement('div');
      notice.style.cssText='position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.72);color:#fff;font-size:11px;font-family:DM Sans,sans-serif;padding:6px 12px;border-radius:20px;z-index:1200;white-space:nowrap;pointer-events:none';
      notice.textContent='Open file locally for full map tiles';
      div.appendChild(notice);
    }
  });

  const catClr={hotel:'#E8762A',dental:'#e83030',activity:'#2A9FD6',food:'#16B8B0',transit:'#7B6EC4'};

  data.markers.forEach(m=>{
    const clr=catClr[m.cat]||'#555';
    const icon=L.divIcon({
      html:`<div style="width:38px;height:38px;border-radius:50%;background:${clr};border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-size:17px;box-shadow:0 2px 10px rgba(0,0,0,.45);cursor:pointer">${m.icon}</div>`,
      className:'',iconSize:[38,38],iconAnchor:[19,19],popupAnchor:[0,-22]
    });
    const popupHtml=`<div style="font-family:'DM Sans',system-ui,sans-serif;min-width:160px">
      <div style="font-size:14px;font-weight:700;color:#1a1410;margin-bottom:4px">${m.icon} ${m.name}</div>
      <div style="font-size:12px;color:#5c5248;line-height:1.4">${m.sub||''}</div>
    </div>`;
    L.marker([m.latlng[0],m.latlng[1]],{icon})
      .addTo(map)
      .bindPopup(popupHtml,{maxWidth:240,className:'mk-popup'});
  });

  setTimeout(()=>map.invalidateSize(),80);
  window._lmap=map;
}

function toggleSearch(){

  if(SEARCH_OPEN){
    so.classList.add('open');SEARCH_Q='';

function doSearch(q){
  SEARCH_Q=q;
  const res=document.getElementById('so-results');
  if(!res)return;
  const lq=q.trim().toLowerCase();

  if(!lq){
    res.innerHTML=`<div class="sr-label">JUMP TO DAY</div>${DAYS.map(d=>`<div class="sr-day" onclick="searchGoDay('${d.d}')"><div style="font-size:13px;font-weight:600;color:var(--t)">${esc(d.lbl)}</div><div style="font-size:12px;color:var(--t2);margin-top:2px">${esc(d.summ.slice(0,70))}${d.summ.length>70?'…':''}</div></div>`).join('')}`;
    return;
  }

  const matchDays=DAYS.filter(d=>(d.lbl+' '+d.summ+' '+locLabel(d.loc)).toLowerCase().includes(lq));
  const matchItems=[...BASE_ITEMS,...FOOD_ITEMS].filter(i=>[(i.title||''),(i.sub||''),(i.addr||''),(i.note||''),(i.ref||'')].join(' ').toLowerCase().includes(lq));

  if(!matchDays.length&&!matchItems.length){
    res.innerHTML=`<div style="text-align:center;padding:40px 0;color:var(--t3);font-size:14px">No results for &ldquo;${esc(q)}&rdquo;</div>`;
    return;
  }

  const ICON={flight:'✈️',accom:'🏨',dental:'🦷',golf:'⛳',activity:'🎯',transport:'🚗',food:'🍽️'};
  let html='';
  if(matchDays.length){
    html+=`<div class="sr-label">DAYS (${matchDays.length})</div>`;
    html+=matchDays.map(d=>`<div class="sr-day" onclick="searchGoDay('${d.d}')"><div style="font-size:13px;font-weight:600;color:var(--t)">${esc(d.lbl)}</div><div style="font-size:12px;color:var(--t2);margin-top:2px">${esc(d.summ.slice(0,80))}${d.summ.length>80?'…':''}</div></div>`).join('');
  }
  if(matchItems.length){
    html+=`<div class="sr-label">ITEMS (${matchItems.length})</div>`;
    html+=matchItems.map(i=>`<div class="sr-day" onclick="searchGoItem('${esc(i.id)}')"><div style="font-size:13px;font-weight:600;color:var(--t)">${ICON[i.type]||'📍'} ${esc(i.title)}</div><div style="font-size:12px;color:var(--t2);margin-top:2px">${esc((i.sub||i.addr||'').slice(0,60))}</div></div>`).join('');
  }
  res.innerHTML=html;
}

function searchGoDay(date){toggleSearch();SEL_DAY=date;sv('trip');}

function searchGoItem(id){
  const item=effectItem(id);if(!item)return;
  toggleSearch();
  if(item.date){SEL_DAY=item.date;sv('trip');return;}
  if(item.status==='locked'||item.status==='pending'){
    BK_TAB=item.type==='flight'?'flights':item.type==='accom'?'hotels':'activities';
    sv('bookings');
  }else{sv('options');}
}

function doOpenLink(){
  /* Synchronous in click handler — popup blockers allow this */
  window.open(PENDING_LINK,'_blank','noopener,noreferrer');
  closeModalForce();
}

function doCopyLink(){
  syncCopy(PENDING_LINK);
  if(navigator.clipboard)navigator.clipboard.writeText(PENDING_LINK).catch(()=>{});
  closeModalForce();
}

function syncCopy(text){
  try{
    const el=document.createElement('textarea');
    el.value=text;el.style.cssText='position:fixed;top:-9999px;left:-9999px;opacity:0';
    document.body.appendChild(el);el.focus();el.select();
    document.execCommand('copy');document.body.removeChild(el);
  }catch{}
}

function buildTripContext(){
  const lines=['=== THAILAND & BALI TRIP 2026 ===','Dates: Thu 17 Sep – Wed 30 Sep, 2026','Travellers: Mike (adult), wife (adult), Ezra (15, son)',''];
  lines.push('ITINERARY:');
  DAYS.forEach(d=>{
    lines.push(`${d.lbl} (${locLabel(d.loc)}): ${d.summ}`);
    itemsForDay(d.d).forEach(i=>lines.push(`  - ${i.time?i.time+' ':''} ${i.title} [${i.status}]${i.ref?' ref:'+i.ref:''}`));
  });
  lines.push('','CONFIRMED BOOKINGS:');
  allItems().filter(i=>i.status==='locked').forEach(i=>lines.push(`  ${i.title}: ${i.sub||''} ${i.ref?'ref:'+i.ref:''} ${i.cost||''}`));
  lines.push('','PENDING (not yet confirmed):');
  allItems().filter(i=>i.status==='pending').forEach(i=>lines.push(`  ${i.title}: ${i.sub||''} ${i.phone?'phone:'+i.phone:''}`));
  return lines.join('\n');
}

    <div class="macts"><button class="mbtn mbtn-cc" onclick="closeModalForce()">Close</button></div>`);
}
